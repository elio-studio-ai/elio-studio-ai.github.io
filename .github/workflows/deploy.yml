name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          set -e
          SHA=36b1ef866e25660fd8183dde609b78faa48c1953
          B=https://raw.githubusercontent.com/elio-studio-ai/preview-v11/$SHA
          mkdir -p _site
          curl -sSf --retry 8 --retry-all-errors --retry-delay 2 -o _site/index.html "$B/home-v39a.html"
          curl -sSf --retry 8 --retry-all-errors --retry-delay 2 -o _site/portfolio.html "$B/portfolio-v38.html"
          for f in _site/index.html _site/portfolio.html; do
            perl -pi -e 's{\Qhttps://elio-studio-ai.github.io/preview-v11/portfolio-v38.html\E}{/portfolio.html}g; s{\Qhttps://elio-studio-ai.github.io/preview-v11/home-v39a.html\E}{/}g; s{(["'"'"'])(img15/|site/|fonts/|video34/)}{$1/preview-v11/$2}g; s{(["'"'"'])portfolio-v38\.html}{$1/portfolio.html}g; s{(["'"'"'])home-v39a\.html}{$1/}g' $f
          done
          touch _site/.nojekyll
          echo "files: $(find _site -type f | wc -l)"
          wc -c _site/index.html _site/portfolio.html
          echo "leftover relative asset refs: $(grep -o -E "[\"'](img15|site|fonts|video34)/" _site/*.html | wc -l)"
          echo "leftover page refs: $(grep -o -E "[\"'](portfolio-v38|home-v39a)\.html" _site/*.html | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
